services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PERSIST: "true"
      DATABASE_PATH: /data/vat.db
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
    expose: ["3001"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  caddy_data:
  caddy_config:
